<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Economy</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="logo.svg" alt="" class="logo" width="30" height="30">
    <h1 data-i18n="app">Token Economy</h1>
    <span id="demo-badge" class="demo-badge" data-i18n="header.demo" data-i18n-title="header.demo.hint" hidden></span>
    <span id="updated" class="muted"></span>
  </div>
  <div class="controls">
    <div class="segmented" id="period" role="group" data-i18n-aria="period.label">
      <button data-p="today" data-i18n="period.today"></button>
      <button data-p="24h" data-i18n="period.24h"></button>
      <button data-p="7d" data-i18n="period.7d" class="active"></button>
      <button data-p="30d" data-i18n="period.30d"></button>
      <button data-p="all" data-i18n="period.all"></button>
    </div>
    <div class="segmented" id="unit" role="group" data-i18n-aria="unit.label" data-i18n-title="unit.hint">
      <button data-u="tokens" data-i18n="unit.tokens"></button>
      <button data-u="usd" data-i18n="unit.usd"></button>
    </div>
    <div class="chips" id="agent-filter"></div>
    <button id="btn-refresh" class="btn" data-i18n="btn.refresh" data-i18n-title="btn.refresh.hint"></button>
    <label class="language-picker">
      <span class="sr" data-i18n="language"></span>
      <select id="language" data-i18n-title="language"></select>
    </label>
    <button id="btn-theme" class="btn icon" data-i18n-title="btn.theme" data-i18n-aria="btn.theme">◐</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <a href="#summary" class="active" data-i18n="tab.summary"></a>
  <a href="#office" data-i18n="tab.office"></a>
  <a href="#overview" data-i18n="tab.overview"></a>
  <a href="#limits" data-i18n="tab.limits"></a>
  <a href="#models" data-i18n="tab.models"></a>
  <a href="#savings" data-i18n="tab.savings"></a>
  <a href="#projects" data-i18n="tab.projects"></a>
  <a href="#tools" data-i18n="tab.tools"></a>
  <a href="#tips" data-i18n="tab.tips"></a>
  <a href="#sources" data-i18n="tab.sources"></a>
</nav>

<main id="content">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p id="loading-status" data-i18n="loading.title"></p>
    <p class="muted" data-i18n="loading.sub"></p>
  </div>

  <section id="summary" class="section" hidden>
    <div class="grid g3 summary-top">
      <div class="card">
        <div class="card-head"><h2 data-i18n="summary.score"></h2></div>
        <div id="summary-score"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="summary.value"></h2></div>
        <div id="summary-value"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="summary.limits"></h2></div>
        <div id="summary-limits"></div>
      </div>
    </div>
    <div class="grid g2">
      <div class="card">
        <div class="card-head"><h2 data-i18n="summary.pie"></h2></div>
        <div class="chart"><canvas id="g-pie"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="summary.days"></h2></div>
        <div class="chart"><canvas id="g-summary-days"></canvas></div>
      </div>
      <div class="card wide">
        <div class="card-head"><h2 data-i18n="summary.insights"></h2><a href="#tips" class="link" data-i18n="summary.insights.view"></a></div>
        <div id="summary-insights"></div>
      </div>
    </div>
  </section>

  <section id="overview" class="section" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="grid g2">
      <div class="card wide">
        <div class="card-head"><h2 id="title-daily"></h2><span class="muted" id="sub-daily"></span></div>
        <p class="explain" id="exp-daily"></p>
        <div class="chart tall"><canvas id="g-daily"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="overview.consumes"></h2></div>
        <p class="explain" id="exp-consumes"></p>
        <div id="share"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="overview.saves"></h2></div>
        <p class="explain" id="exp-saves"></p>
        <div id="savings-by-agent"></div>
      </div>
    </div>
  </section>

  <section id="limits" class="section" hidden>
    <div class="card wide" style="margin-bottom:16px">
      <div class="card-head"><h2 data-i18n="win.title"></h2></div>
      <p class="explain" data-i18n="win.explain"></p>
      <div id="lim-windows"></div>
    </div>
    <div class="grid g2">
      <div class="card wide">
        <div class="card-head"><h2 data-i18n="lim.history"></h2></div>
        <p class="explain" data-i18n="lim.chart.explain"></p>
        <div class="chart"><canvas id="g-codex-limit"></canvas></div>
        <div class="empty" id="lim-history-empty" data-i18n="lim.history.empty" hidden></div>
        <h2 style="margin-top:18px" data-i18n="lim.windows"></h2>
        <div class="table-scroll"><table id="t-windows"></table></div>
      </div>
      <div class="card wide">
        <div class="card-head"><h2 data-i18n="lim.last5h"></h2></div>
        <p class="explain" data-i18n="lim.last5h.explain"></p>
        <div id="last-5h"></div>
      </div>
    </div>
  </section>

  <section id="models" class="section" hidden>
    <div class="grid g2">
      <div class="card wide">
        <div class="card-head"><h2 data-i18n="mod.table"></h2></div>
        <p class="explain" data-i18n="mod.table.explain"></p>
        <div class="table-scroll"><table id="t-models"></table></div>
      </div>
      <div class="card wide">
        <div class="card-head"><h2 data-i18n="mod.perHour"></h2></div>
        <div class="chart"><canvas id="g-hour"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="mod.composition"></h2></div>
        <p class="explain" data-i18n="mod.composition.explain"></p>
        <div class="chart"><canvas id="g-composition"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="mod.hourOfDay"></h2></div>
        <p class="explain" data-i18n="mod.hourOfDay.explain"></p>
        <div class="chart"><canvas id="g-hour-of-day"></canvas></div>
      </div>
    </div>
  </section>

  <section id="savings" class="section" hidden>
    <div class="kpis" id="kpis-savings"></div>
    <div class="card wide" style="margin-bottom:16px">
      <div class="card-head"><h2 data-i18n="sav.mine"></h2></div>
      <p class="explain" data-i18n="sav.mine.explain"></p>
      <div id="sav-tools" class="grid g3" style="margin:0"></div>
    </div>
    <div class="card wide" id="block-sav-add" style="margin-bottom:16px" hidden>
      <div class="card-head"><h2 data-i18n="add.title"></h2></div>
      <p class="explain" data-i18n="add.explain"></p>
      <div id="sav-add"></div>
    </div>
    <div class="card wide" id="block-sav-projects" style="margin-bottom:16px" hidden>
      <div class="card-head"><h2 data-i18n="sav.proj"></h2></div>
      <p class="explain" data-i18n="sav.proj.explain"></p>
      <div class="table-scroll"><table id="t-sav-projects"></table></div>
    </div>
    <div class="grid g2">
      <div class="card wide" id="block-sav-day">
        <div class="card-head"><h2 id="title-sav-day"></h2></div>
        <div class="chart"><canvas id="g-savings"></canvas></div>
      </div>
      <div class="card wide" id="block-rtk-cmd">
        <div class="card-head"><h2 data-i18n="sav.rtkCmd"></h2></div>
        <p class="explain" data-i18n="sav.rtkCmd.explain"></p>
        <div class="table-scroll"><table id="t-rtk-cmd"></table></div>
      </div>
      <div class="card" id="block-rtk-hook">
        <div class="card-head"><h2 data-i18n="sav.hook"></h2></div>
        <p class="explain" data-i18n="sav.hook.explain"></p>
        <div id="rtk-hook"></div>
      </div>
      <div class="card" id="block-rtk-failures">
        <div class="card-head"><h2 data-i18n="sav.failures"></h2></div>
        <p class="explain" data-i18n="sav.failures.explain"></p>
        <div id="rtk-failures"></div>
      </div>
      <div class="card wide" id="block-headroom">
        <div class="card-head"><h2 data-i18n="sav.headroom"></h2></div>
        <div class="table-scroll"><table id="t-headroom"></table></div>
      </div>
    </div>
  </section>

  <section id="projects" class="section" hidden>
    <div class="grid g2">
      <div class="card wide">
        <div class="card-head"><h2 data-i18n="proj.top"></h2></div>
        <div class="table-scroll"><table id="t-projects"></table></div>
      </div>
      <div class="card wide">
        <div class="card-head"><h2 data-i18n="proj.sessions"></h2></div>
        <div class="table-scroll"><table id="t-sessions"></table></div>
      </div>
    </div>
  </section>

  <section id="tools" class="section" hidden>
    <div class="grid g3" id="tools-grid"></div>
    <div class="grid g2">
      <div class="card wide">
        <div class="card-head"><h2 data-i18n="ol.title"></h2></div>
        <div id="ollama"></div>
      </div>
    </div>
  </section>

  <section id="tips" class="section" hidden>
    <div class="card wide" style="margin-bottom:16px">
      <div class="card-head"><h2 data-i18n="score.title"></h2></div>
      <p class="explain" data-i18n="score.explain"></p>
      <div id="score-detail"></div>
    </div>
    <div class="card wide" id="card-ai">
      <div class="card-head"><h2 data-i18n="ai.title"></h2></div>
      <p class="explain" data-i18n="ai.explain"></p>
      <div class="ai-form">
        <label><span data-i18n="ai.use"></span><select id="ai-provider"></select></label>
        <label id="ai-field-api" hidden><span>API</span><select id="ai-api"></select></label>
        <label id="ai-field-url" hidden><span data-i18n="ai.url"></span><input id="ai-url" type="url" spellcheck="false"></label>
        <label id="ai-field-model"><span data-i18n="ai.model"></span><input id="ai-model" list="ai-models" spellcheck="false"><datalist id="ai-models"></datalist></label>
        <label id="ai-field-key" hidden><span data-i18n="ai.key"></span><input id="ai-key" type="password" autocomplete="off" spellcheck="false"></label>
        <label id="ai-field-command" hidden class="wide"><span data-i18n="ai.command"></span><input id="ai-command" spellcheck="false"></label>
        <label><span data-i18n="ai.days"></span><select id="ai-days"><option value="7"></option><option value="14"></option><option value="30"></option></select></label>
        <div class="ai-buttons">
          <button id="ai-analyze" class="btn primary" data-i18n="ai.analyze"></button>
          <a id="ai-view-prompt" href="/api/ai/prompt" target="_blank" rel="noopener" data-i18n="ai.viewPrompt"></a>
        </div>
      </div>
      <p class="explain" id="ai-notice"></p>
      <div id="ai-status"></div>
      <div id="ai-result"></div>
    </div>
    <div class="card wide">
      <div class="card-head"><h2 data-i18n="rules.title"></h2></div>
      <p class="explain" data-i18n="rules.explain"></p>
      <div id="tip-list"></div>
    </div>
  </section>

  <section id="office" class="section" hidden>
    <iframe id="office-frame" title="office" class="office-frame"></iframe>
  </section>

  <section id="sources" class="section" hidden>
    <div class="card wide" style="margin-bottom:16px">
      <div class="card-head"><h2 data-i18n="update.title"></h2><button id="btn-update-check" class="btn" data-i18n="update.check"></button></div>
      <div id="update-box"></div>
    </div>
    <div class="card wide" style="margin-bottom:16px">
      <div class="card-head"><h2 data-i18n="donate.title"></h2></div>
      <p class="explain" data-i18n="donate.explain"></p>
      <div id="donate-box"></div>
    </div>
    <div class="card wide" style="margin-bottom:16px">
      <div class="card-head"><h2 data-i18n="settings.limits"></h2></div>
      <p class="explain" data-i18n="settings.limits.explain"></p>
      <label class="check"><input type="checkbox" id="set-claude-limits"> <span data-i18n="settings.limits.enable"></span></label>
    </div>
    <div class="card wide" style="margin-bottom:16px">
      <div class="card-head"><h2 data-i18n="subs.title"></h2></div>
      <p class="explain" data-i18n="subs.explain"></p>
      <div id="subscriptions"></div>
    </div>
    <div class="card wide">
      <div class="card-head"><h2 data-i18n="sources.title"></h2></div>
      <div class="table-scroll"><table id="t-sources"></table></div>
      <p class="explain" id="sources-note"></p>
    </div>
    <div class="card wide" style="margin-top:16px">
      <div class="card-head"><h2 data-i18n="prices.title"></h2><button id="btn-prices" class="btn" data-i18n="prices.refresh"></button></div>
      <p class="explain" data-i18n="prices.explain"></p>
      <div id="price-sources"></div>
      <h2 style="margin-top:18px" data-i18n="prices.byModel"></h2>
      <div class="table-scroll"><table id="t-prices"></table></div>
    </div>
  </section>
</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
